# DataGenie — Visual Theme Configuration
# Dark theme (default): Oceanic Midnight Navy + Luminous Coral + Electric Sky Blue.
# Inspired by Linear, Vercel, and Hex dark modes: high contrast, calm, breathable.
# Light theme also supported via ⋮ (top-right menu) → Settings → Theme.

[theme]
base = "dark"
primaryColor = "#FF6B6B"
backgroundColor = "#0C1322"
secondaryBackgroundColor = "#131E35"
textColor = "#F1F5F9"
borderColor = "#1E2F52"
linkColor = "#38BDF8"
codeBackgroundColor = "#14213B"
dataframeHeaderBackgroundColor = "#14213B"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#FF6B6B", "#38BDF8", "#34D399", "#FBBF24", "#F472B6", "#A78BFA"]

[theme.sidebar]
backgroundColor = "#080E1B"
secondaryBackgroundColor = "#101A2F"
textColor = "#F1F5F9"
borderColor = "#182744"
primaryColor = "#FF6B6B"
linkColor = "#38BDF8"

# ----------------------------------------------------------------- Dark ----
